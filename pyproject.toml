[project]
name = "nbis_project_admin"
authors = [{ name = "Per Unneberg", email = "per.unneberg@scilifelab.se" }]
description = "NBIS project admin"
readme = "README.md"
keywords = ["bioinformatics"]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  'click>=8.0',
  "pypandoc>=1.15",
  "jinja2>=3.1.6",
  "toml>=0.10.2",
  "ruamel-yaml>=0.18.10",
  "jsonschema>=4.23.0",
]
dynamic = ["version"]
requires-python = ">= 3.11,<3.14"

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "pytest>=8.3.5",
  "snakemake>=9.1.9",
  "tox>=4.25.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "src/nbis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nbis"]

[project.scripts]
nbis-admin = "nbis.cli:cli"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q", "--doctest-modules"]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.tox]
requires = ["tox>=4", "tox-uv>=1"]
env_list = ["py311", "py312", "py313"]
isolated_build = true

[tool.tox.env.test]
change_dir = "tests"
deps = ["pytest", "pytest-cov", "pytest-shutil", "pytest-git"]
commands = [["pytest", "--basetemp={env_tmp_dir}", "{posargs}"]]

[tool.tox.env.project]
allowlist_externals = ["git", "touch", "uv", "pixi"]
changedir = "{envtmpdir}/project_foo"
set_env = { SKIP = "lint" }
deps = [
  "build",
  "pre-commit",
  "basedpyright",
  "pytest",
  "pytest-cov",
  "pytest-shutil",
  "pytest-git",
]
commands = [
  [
    "nbis-admin",
    "init",
    ".",
  ],
  [
    "git",
    "init",
    "-b",
    "main",
    ".",
  ],
  [
    "git",
    "add",
    "-f",
    ".",
  ],
  [
    "pixi",
    "run",
    "project_foo",
  ],
  [
    "uv",
    "pip",
    "install",
    "-e",
    ".",
    "--no-deps",
  ],
  [
    "uv",
    "pip",
    "install",
    "snakemake",
    "pandas",
  ],
  [
    "project_foo",
  ],
  [
    "project_foo",
    "--help",
  ],
  [
    "nbis-admin",
    "config",
    "init",
  ],
  [
    "nbis-admin",
    "config",
    "example",
  ],
  [
    "nbis-admin",
    "add",
    "template",
    "-t",
    "quarto",
  ],
  [
    "nbis-admin",
    "add",
    "tool",
    "my_tool",
  ],
  [
    "nbis-admin",
    "add",
    "quarto",
  ],
  [
    "touch",
    "src/project_foo/tools/__init__.py",
  ],
  [
    "nbis-admin",
    "smk",
    "init",
  ],
  [
    "nbis-admin",
    "smk",
    "add",
    "main",
  ],
  [
    "git",
    "add",
    ".",
    "_quarto.yml",
    "src/project_foo/tools/my_tool.py",
  ],
  [
    "project_foo",
  ],
  [
    "project_foo",
    "smk",
  ],
  [
    "project_foo",
    "smk",
    "main",
    "run",
    "--no-profile",
    "--cores",
    "1",
  ],
  [
    "nbis-admin",
    "--version",
  ],
  [
    "nbis-admin",
    "add",
    "diary",
  ],
  [
    "project_foo",
    "quarto",
    "--help",
  ],
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # warn about shadowing built-ins
  "E",    # style stuff, whitespaces
  "F",    # important pyflakes lints
  "I",    # import sorting
  "N",    # naming
  "T100", # breakpoints
]
ignore = ["N806"]

[tool.ruff.lint.isort]
# so it knows to group first-party stuff last
known-first-party = ["nbis"]

[tool.basedpyright]
typeCheckingMode = "standard"
