[project]
name = "nbis_project_admin"
authors = [
    {name = "Per Unneberg", email = "per.unneberg@scilifelab.se"},
]
description = "NBIS project admin"
readme = "README.md"
keywords = ["bioinformatics"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    'click>=8.0',
    "pypandoc>=1.15",
    "jinja2>=3.1.6",
    "toml>=0.10.2",
    "ruamel-yaml>=0.18.10",
    "jsonschema>=4.23.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyter-book>=1.0.4.post1",
    "pylint>=3.3.6",
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "snakemake>=9.1.9",
    "tox>=4.25.0",
]
lint = [
     "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "src/nbis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nbis"]



[project.scripts]
nbis-admin = "nbis.cli:cli"

[tool.pytest]
minversion = "9.0"
addopts = "-ra -q --doctest-modules"
pythonpath = [
    "src"
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.basedpyright]
venvPath = ".pixi/envs"
venv = "dev"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313
isolated_build = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv:test]
changedir = tests
deps =
    pytest
    pytest-coverage
    pytest-shutil
    pytest-git
    pytest-runner
    pip>=22.1.0
    wheel
commands =
    pytest --basetemp="{envtmpdir}" {posargs}

[testenv:project]
allowlist_externals =
    git
    touch
    uv
changedir = {envtmpdir}/project_foo
setenv =
    SKIP = lint
deps =
    build
    pre-commit
    pyright
    pytest
    pytest-coverage
    pytest-shutil
    pytest-git
    pytest-runner
    pip>=22.1.0
    wheel
commands =
    nbis-admin init .
    git init -b main .
    git add -f .
    uv pip install -e . --no-deps
    uv pip install snakemake pandas
    project_foo
    nbis-admin config init
    nbis-admin add template -t quarto
    nbis-admin add tool my_tool
    touch src/project_foo/tools/__init__.py
    nbis-admin smk init
    nbis-admin smk add
    git add . _quarto.yml src/project_foo/tools/my_tool.py
    project_foo
    project_foo smk
    project_foo smk run --no-profile --cores 1
    nbis-admin --version
    nbis-admin add diary
    pre-commit
"""

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format=true

[tool.ruff.lint]
select = [
  "A",    # warn about shadowing built-ins
  "E",    # style stuff, whitespaces
  "F",    # important pyflakes lints
  "I",    # import sorting
  "N",    # naming
  "T100", # breakpoints
]
ignore = ["N806"]

[tool.ruff.lint.isort]
# so it knows to group first-party stuff last
known-first-party = ["nbis"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
nbis_project_admin = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.lint.tasks]
actionlint = { cmd = "actionlint", env = { SHELLCHECK_OPTS = "-e SC2086" } }
lint = { cmd = "pre-commit run --all-files --hook-stage=manual", description = "Run all linters and formatters on all code" }
pre-commit-install = "pre-commit install --install-hooks -t=pre-commit -t=pre-push"
pre-commit-install-minimal = "pre-commit install -t=pre-commit"
pre-commit-run = "pre-commit run --all-files"
ruff-format = "ruff format --force-exclude"
ruff-lint = "ruff check --fix --exit-non-zero-on-fix --force-exclude"
shell-format = "shfmt --write --indent=4 --simplify --binary-next-line"
toml-format = { cmd = "taplo fmt", env = { RUST_LOG = "warn" } }
toml-lint = "taplo lint --verbose **/pyproject.toml"
typecheck-python = "mypy"
typos = "typos --write-changes --force-exclude"

[tool.pixi.feature.lint.dependencies]
pre-commit = "*"
pre-commit-hooks = "*"
ruff = "*"
typos = "*"
actionlint = "*"
go-shfmt = "*"
taplo = "*"
pylint = ">=3.3.8,<4"

[tool.pixi.dependencies]
r-base = ">=4.5.3,<4.6"
r-bookdown = ">=0.47,<0.48"
r-rmarkdown = ">=2.32,<3"
