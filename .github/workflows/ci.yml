name: CI

on: [push, pull_request]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [py311, py312, py313]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.34.0
          environments: ${{ matrix.env }}
          cache: true
          frozen: true

      - name: Diagnostic — check package data
        run: |
          pixi exec --spec python-build python -m build --wheel --outdir /tmp/wheel
          unzip -l /tmp/wheel/*.whl | grep -E "(templates|\.j2|\.gitignore|\.pre-commit)" | head -50

      - name: Run tests
        run: pixi run pytest

      - name: Run tox to test installation of project
        run: pixi run tox -e project
